name: WristMouse
options:
  bundleIdPrefix: com.ngiangbao
  deploymentTarget:
    watchOS: "10.0"

targets:
  WristMouse:
    type: application.watchapp2
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: WristMouse
    info:
      path: WristMouse/Info.plist
      properties:
        CFBundleDisplayName: WristMouse
        WKApplication: true
        WKWatchOnly: true
        UIRequiredDeviceCapabilities: [watch-companion]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ngiangbao.wristmouse
        PRODUCT_NAME: WristMouse
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "4"
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: false
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Automatic
